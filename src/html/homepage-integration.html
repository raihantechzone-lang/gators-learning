<!-- Added only: authentication + database/backend wiring. No UI/design changes. -->
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://jouwcthdcjoegcqgwlpl.supabase.co",
    "sb_publishable_Y1rY5LYRuDF9iqJNWS1blQ_9EqPBOp9",
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: "gators-learning-auth",
      },
    }
  );
  window.supabase = supabase;

  let currentUser = null;
  let currentProfile = null;
  window.db = window.db || { courses: [], feedbacks: [] };

  /* ---------- header auth state ---------- */
  function renderAuthState() {
    const authBtns = document.getElementById("auth-buttons");
    const profileBtn = document.getElementById("profile-button");
    
    if (currentUser) {
      if (authBtns) {
        authBtns.classList.add("hidden");
        authBtns.classList.remove("flex");
      }
      
      if (profileBtn) {
        profileBtn.classList.remove("hidden");
        profileBtn.classList.add("flex");
      }

      const name =
        currentProfile?.full_name ||
        currentUser.user_metadata?.full_name ||
        currentUser.email ||
        "Student";
      const nameEl = document.getElementById("dropdown-user-name");
      if (nameEl) nameEl.innerText = name;
      const rollEl = document.getElementById("dropdown-roll-number");
      if (rollEl) rollEl.innerText = currentProfile?.roll_number ? "Roll: " + currentProfile.roll_number : "";
      
      const photo = currentProfile?.photo_url || currentUser.user_metadata?.avatar_url;
      
      // Update profile
      const img = document.getElementById("header-profile-img");
      const icon = document.getElementById("header-profile-icon");
      if (photo && img && icon) {
        img.src = photo;
        img.classList.remove("hidden");
        icon.classList.add("hidden");
      }

    } else {
      if (profileBtn) {
        profileBtn.classList.add("hidden");
        profileBtn.classList.remove("flex");
      }
      
      if (authBtns) {
        authBtns.classList.remove("hidden");
        authBtns.classList.add("flex");
      }
    }
  }

  async function loadProfile() {
    if (!currentUser) {
      currentProfile = null;
      return;
    }
    const { data } = await supabase.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
    currentProfile = data ?? null;
  }

  async function checkEnrollment(courseId) {
    if (!currentUser) return false;
    // Only an approved (active) enrollment unlocks the course; a pending payment does not.
    const { data } = await supabase.from("enrollments").select("id").eq("profile_id", currentUser.id).eq("course_id", courseId).eq("status", "active").or("payment_status.is.null,payment_status.not.in.(pending,failed)").maybeSingle();
    return !!data;
  }

  supabase.auth.onAuthStateChange((event, session) => {
    const isFirstTime = !currentUser && session?.user;
    currentUser = session?.user ?? null;
    renderAuthState();
    // Database calls must run after the auth callback releases its session lock.
    setTimeout(async () => {
    
    if (isFirstTime) {
      // Check if profile exists, if not create one (for Google OAuth/Signup)
      const { data: profile } = await supabase.from("profiles").select("id").eq("id", currentUser.id).maybeSingle();
      if (!profile) {
        const fullName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || "Student";
        const rollNumber = "GL" + Math.floor(100000 + Math.random() * 899999);
        await supabase.from("profiles").insert({
          id: currentUser.id,
          full_name: fullName,
          roll_number: rollNumber,
          avatar_url: currentUser.user_metadata?.avatar_url
        });
      }
    }

    await loadProfile();
    renderAuthState();

    // Explicit login handlers redirect; restoring a saved session must keep Home open.
    if (window.currentCourseId) await loadCourseDetails(window.currentCourseId);
    }, 0);
  });

  /* ---------- database: site settings ---------- */
  async function loadSettings() {
    const { data } = await supabase.from("settings").select("setting_key, setting_value");
    if (!data) return;
    for (const row of data) {
      if (!row.setting_value) continue;
      const el = document.getElementById(row.setting_key === "hero_title" ? "dynamic-site-title" : row.setting_key === "hero_subtitle" ? "dynamic-site-subtitle" : "");
      if (el) el.textContent = row.setting_value;
    }
  }

  /* ---------- database: courses ---------- */
  let allCourses = [];
  let currentFilter = 'all';
  let searchQuery = '';

  async function loadCourses() {
    // 1. Load Categories for the tabs
    const { data: categoriesData } = await supabase
      .from("categories")
      .select("name")
      .order("name", { ascending: true });
    
    renderCategoryTabs(categoriesData || []);

    // 2. Load Courses
    const { data: courses } = await supabase
      .from("courses")
      .select("*")
      .eq("is_published", true)
      .order("created_at", { ascending: false });
      
    if (!courses) {
        allCourses = [];
        renderFilteredCourses();
        return;
    }
    
    const { data: contents } = await supabase.from("course_contents").select("id, course_id");
    const counts = {};
    (contents || []).forEach((c) => {
      counts[c.course_id] = (counts[c.course_id] || 0) + 1;
    });

    allCourses = courses.map((c) => ({
      id: c.id,
      name: c.category || "Course",
      title: c.title,
      category: (c.category || "versity").toLowerCase(),
      price: c.discount_price ?? c.price ?? 0,
      discountPrice: c.price ?? 0, // Invert if price is original
      thumbnail: c.thumbnail_url || "https://ik.imagekit.io/n7rgjyaxh/default-course.jpg",
      videosCount: counts[c.id] || 0,
      videos: new Array(counts[c.id] || 0),
    }));

    window.db.courses = allCourses;
    renderFilteredCourses();
    
    // Global real-time synchronization
    if (!window.hasSiteSync) {
        window.hasSiteSync = true;
        supabase.channel('public-site-sync')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'courses' }, (payload) => {
            console.log('Realtime update: Course updated', payload.new);
            if (window.showToast) window.showToast(`Course "${payload.new.title}" updated in real time.`, "Live Update");
            loadCourses();
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, (payload) => {
            console.log('Realtime update: Settings changed', payload.new);
            if (window.showToast) window.showToast(`Site setting "${payload.new.setting_key}" updated.`, "Live Update");
            loadSettings();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'course_contents' }, (payload) => {
            console.log('Realtime update: Course content changed');
            if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
              if (window.showToast) window.showToast(`New content added or updated.`, "Live Update");
            }
            if (window.currentCourseId) loadCourseDetails(window.currentCourseId);
            loadCourses();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'reviews' }, () => loadReviews())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'app_ads' }, () => showInterstitialAd())
          .subscribe();
    }
  }

  function renderCategoryTabs(categories) {
    const tabsContainer = document.querySelector('.flex.items-center.space-x-2.bg-gray-100\\/50.p-1\\.5.rounded-xl.border.border-gray-100.overflow-x-auto.hide-scrollbar');
    if (!tabsContainer) return;

    // Preserve the "All" tab
    const allTabHtml = `
      <button id="tab-all" onclick="filterCourses('all')" class="tab-btn active px-5 py-2 rounded-lg text-sm font-bold transition-all whitespace-nowrap bg-white text-rs-dark shadow-sm">All</button>
    `;

    const categoryTabsHtml = categories.map(cat => `
      <button id="tab-${cat.name.toLowerCase().replace(/\s+/g, '-')}" onclick="filterCourses('${cat.name.toLowerCase()}')" class="tab-btn px-5 py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-rs-dark transition-all whitespace-nowrap">
        ${cat.name}
      </button>
    `).join('');

    tabsContainer.innerHTML = allTabHtml + categoryTabsHtml;
  }

  function renderFilteredCourses() {
    const grid = document.getElementById("courses-grid");
    if (!grid) return;

    // Filter courses based on currentFilter and searchQuery
    const filtered = allCourses.filter(c => {
      const matchesFilter = currentFilter === 'all' || c.category === currentFilter;
      const matchesSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                           (c.name && c.name.toLowerCase().includes(searchQuery.toLowerCase()));
      return matchesFilter && matchesSearch;
    });

    window.db.courses = filtered;
    grid.innerHTML = "";
    
    if (filtered.length === 0) {
      grid.className = "col-span-full flex flex-col items-center justify-center py-20 text-center";
      grid.innerHTML = `
        <div class="bg-white p-10 rounded-[2.5rem] border border-gray-100 shadow-sm max-w-md mx-auto">
          <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fa-solid fa-graduation-cap text-3xl text-rs-green"></i>
          </div>
          <h3 class="font-bengali font-bold text-gray-900 text-xl mb-3">কোনো কোর্স পাওয়া যায়নি</h3>
          <p class="font-bengali text-gray-500 text-sm">দুঃখিত, এই মুহূর্তে কোনো কোর্স এভেইলেবল নেই। দয়া করে পরে আবার চেষ্টা করুন।</p>
        </div>
      `;
      return;
    } else {
      grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6";
    }
    
    window.renderDynamicCourses?.();

    // Wire events
    Array.from(grid.children).forEach((card, i) => {
      const course = filtered[i];
      if (!course) return;
      card.querySelectorAll("button, img, h3").forEach((el) => {
        el.addEventListener("click", () => {
          window.location.href = "/enroll/" + encodeURIComponent(course.id);
        });
      });
    });
  }

  window.filterCourses = (cat) => {
    currentFilter = cat.toLowerCase();
    
    // Update active tab UI
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      if (tab.id === `tab-${currentFilter}`) {
        tab.classList.add('active', 'bg-white', 'text-rs-dark', 'shadow-sm');
        tab.classList.remove('text-gray-500');
      } else {
        tab.classList.remove('active', 'bg-white', 'text-rs-dark', 'shadow-sm');
        tab.classList.add('text-gray-500');
      }
    });
    
    renderFilteredCourses();
  };

  window.searchCourses = (val) => {
    searchQuery = val;
    renderFilteredCourses();
  };

  async function loadCourseDetails(id) {
    const mount = document.getElementById('yt-mount');
    const setVideoMessage = (message) => {
      if (mount && !mount.querySelector('iframe')) mount.textContent = message;
    };
    const { data: course, error: courseError } = await supabase.from("courses").select("*").eq("id", id).abortSignal(AbortSignal.timeout(15000)).maybeSingle();
    if (courseError || !course) {
      setVideoMessage(courseError ? 'কোর্স লোড করা যায়নি। পেজটি রিফ্রেশ করে আবার চেষ্টা করুন।' : 'কোর্সটি পাওয়া যায়নি।');
      const title = document.getElementById('course-title');
      if (title) title.textContent = courseError ? 'কোর্স লোড করা যায়নি' : 'কোর্সটি পাওয়া যায়নি';
      const count = document.getElementById('course-content-count');
      if (count) count.textContent = 'কন্টেন্ট পাওয়া যায়নি';
      return;
    }
    
    // Update basic UI info
    const titleEls = document.querySelectorAll('h1, #vid-title-overlay');
    titleEls.forEach(el => el.innerText = course.title);
    
    const descEls = document.querySelectorAll('main p.font-bengali, #course-description');
    descEls.forEach(el => el.innerText = course.description || course.details || "");

    const priceEls = document.querySelectorAll('h2, .course-price, [id*="price"]');
    priceEls.forEach(el => {
      if (el.innerText.includes("৳") || el.tagName === "H2" || el.classList.contains('course-price')) {
         el.innerText = "৳" + (course.discount_price || course.price);
      }
    });
    
    // Payment instructions from admin settings (bKash number) + real course price
    try {
      const payEl = document.getElementById('payment-instructions');
      if (payEl) {
        const { data: bk } = await supabase.from("settings").select("setting_value").eq("setting_key", "bkash_number").maybeSingle();
        const amount = course.discount_price || course.price;
        const num = bk && bk.setting_value ? bk.setting_value : "";
        if (num && amount) {
          payEl.innerHTML = 'নিচের bKash নম্বরে <b>৳' + amount + '</b> সেন্ড মানি করুন: <b class="font-mono">' + num + '</b><br>তারপর Transaction ID নিচে দিন।';
        } else {
          payEl.innerText = "পেমেন্ট তথ্য এখনো যোগ করা হয়নি। অনুগ্রহ করে অ্যাডমিনের সাথে যোগাযোগ করুন।";
        }
      }
    } catch (e) { console.error("payment instructions", e); }

    const oldPriceEls = document.querySelectorAll('.line-through');
    oldPriceEls.forEach(el => el.innerText = "৳" + course.price);

    window.__courseThumb = course.thumbnail_url || null;
    const posterImg = document.getElementById('vid-poster');
    if (posterImg && course.thumbnail_url) {
      posterImg.src = course.thumbnail_url;
      posterImg.classList.remove('hidden');
    }
    
    // Update breadcrumbs
    const breadcrumbCourse = document.querySelector('nav span.text-surface-900.truncate');
    if (breadcrumbCourse) breadcrumbCourse.innerText = course.title;

    // Enrollment logic integration
    const enrollBtn = document.getElementById('enroll-main-btn');
    const isEnrolled = !!(currentUser && await checkEnrollment(id));

    if (enrollBtn) {
      enrollBtn.disabled = false;
      if (isEnrolled) {
        enrollBtn.innerText = "Continue Learning";
        enrollBtn.onclick = () => window.location.href = "/courses/" + id;
      } else {
        enrollBtn.onclick = () => {
          if (currentUser) {
            if (typeof window.openModal === 'function') {
                window.openModal("paymentModal");
            } else {
                window.location.href = "/enroll/" + id;
            }
          } else {
            window.showToast("Please log in to enroll.", "Login Required");
            if (typeof window.openModal === 'function') {
                window.openModal("authModal", "login");
            }
          }
        };
      }
    }

    // Payment form integration (for /enroll page)
    const paymentForm = document.querySelector('#paymentModal form') || document.getElementById('payment-form');
    if (paymentForm) {
      paymentForm.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('pay-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;

        const fd = new FormData(paymentForm);
        // Match specific placeholders/labels from enrollment HTML
        const fullName = fd.get('full_name') || fd.get('Full Name') || paymentForm.querySelector('input[placeholder="Full Name"]')?.value;
        const phone = fd.get('mobile') || fd.get('Phone Number') || paymentForm.querySelector('input[placeholder*="Phone Number"]')?.value;
        const trxId = fd.get('transaction_id') || fd.get('Transaction ID') || paymentForm.querySelector('input[placeholder*="e.g."]')?.value;

        try {
          // 1. Ensure user is logged in
          if (!currentUser) {
            window.showToast("Please log in first to enroll.", "Login required");
            window.openModal("authModal", "login");
            throw new Error("User not authenticated");
          }

          const userId = currentUser.id;

          // 1. Save the student's name & phone to their profile (non-fatal if blocked)
          const { error: profileError } = await supabase.from("profiles").update({ full_name: fullName, phone: phone }).eq("id", userId);
          if (profileError) console.error("Profile update failed:", profileError.message);

          // 2. Save the payment as a pending enrollment row (admin approves it later)
          const amount = course?.discount_price || course?.price || 0;
          const { error: enrollError } = await supabase.from("enrollments").insert({
            profile_id: userId,
            course_id: id,
            payment_method: "bkash",
            payment_status: "pending",
            amount_paid: amount,
            bkash_trx_id: trxId
          });
          if (enrollError) throw enrollError;

          window.showToast("Enrollment submitted! We will verify your payment shortly.", "Success");
          window.closeModal("paymentModal");
          
          // Redirect to dashboard where they can see pending status
          setTimeout(() => window.location.href = "/dashboard", 2000);
        } catch (err) {
          if (err.message !== "User not authenticated") {
            window.showToast(err.message, "Enrollment Error");
          }
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      };
    }

    // Load contents and populate the list
    const { data: contents, error: contentsError } = await supabase.from("course_contents")
      .select("*")
      .eq("course_id", id)
      .order("position", { ascending: true })
      .abortSignal(AbortSignal.timeout(15000));
    
    const contentContainer = document.querySelector('section .bg-white.border.border-slate-200\\/60.rounded-3xl');
    if (contentsError) {
      setVideoMessage('ক্লাসের তথ্য লোড করা যায়নি। পেজটি রিফ্রেশ করে আবার চেষ্টা করুন।');
      const list = contentContainer?.querySelector('.flex.flex-col');
      if (list) list.textContent = 'ক্লাসের তথ্য লোড করা যায়নি।';
      const count = document.getElementById('course-content-count');
      if (count) count.textContent = 'কন্টেন্ট লোড করা যায়নি';
      return;
    }
    if (contentContainer && contents) {
       const count = document.getElementById('course-content-count');
       if (count) count.textContent = contents.length + ' lessons';
       const list = contentContainer.querySelector('.flex.flex-col');
       if (list) {
          list.innerHTML = "";
          if (contents.length === 0) {
            list.innerHTML = `
              <div class="p-8 text-center text-slate-400 font-bengali">
                <i class="fa-solid fa-box-open text-3xl mb-3 block opacity-20"></i>
                এখনও কোনো কন্টেন্ট আপলোড করা হয়নি।
              </div>`;
          }
          window.__playable = [];
          window.playNextLesson = () => {
            const list = window.__playable || [];
            const next = (window.__currentLessonIndex ?? -1) + 1;
            if (list[next] && window.loadLesson) window.loadLesson(list[next].vId, list[next].title, next, true, list[next].thumb);
          };

          contents.forEach((c, idx) => {

             const isLocked = !c.is_free && !isEnrolled;
             const item = document.createElement("div");
             item.className = `group flex items-center justify-between p-4 sm:px-6 hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-100 last:border-0 ${isLocked ? 'opacity-80' : 'relative overflow-hidden'}`;
             if (!isLocked) {
                item.innerHTML = `<div class="absolute left-0 top-0 bottom-0 w-1 bg-brand-500"></div>`;
             }
             item.innerHTML += `
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full ${isLocked ? 'bg-slate-100 text-slate-400' : 'bg-brand-50 text-brand-600'} flex items-center justify-center shrink-0">
                        <i class="fa-solid ${isLocked ? 'fa-lock' : 'fa-play'} text-sm"></i>
                    </div>
                    <div>
                        <h4 class="font-bengali ${isLocked ? 'font-medium text-slate-700' : 'font-semibold text-surface-900'} text-base">${c.title}</h4>
                        <p class="text-xs text-slate-400 font-medium mt-1">${isLocked ? 'Locked' : 'Free Preview'}</p>
                    </div>
                </div>
                ${!isLocked ? '<span class="bg-white border border-slate-200 text-slate-500 px-3 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase shadow-sm">Play</span>' : ''}
             `;
             const vidId = (url) => {
                if (!url) return null;
                const value = String(url).trim();
                if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return value;
                try {
                  const parsed = new URL(value);
                  const host = parsed.hostname.replace(/^www\./, '');
                  const parts = parsed.pathname.split('/').filter(Boolean);
                  const candidate = host === 'youtu.be' ? parts[0]
                    : /^(m\.)?youtube\.com$|^youtube-nocookie\.com$/.test(host)
                    ? parsed.searchParams.get('v') || (['embed', 'shorts', 'live', 'v'].includes(parts[0]) ? parts[1] : null)
                    : null;
                  return candidate && /^[a-zA-Z0-9_-]{11}$/.test(candidate) ? candidate : null;
                } catch { return null; }
             };
             const playableId = vidId(c.youtube_url);
             let myIndex = -1;
             if (!isLocked && playableId) {
                window.__playable = window.__playable || [];
                myIndex = window.__playable.length;
                window.__playable.push({ vId: playableId, title: c.title, thumb: c.thumbnail_url });
             }

             item.onclick = () => {
                if (isLocked) {
                   window.showToast("Enroll to unlock this lesson.", "Locked Content");
                   return;
                }
                if (!playableId) {
                   window.showToast("এই ক্লাসে কোনো ভিডিও যুক্ত করা হয়নি।", "No Video");
                   return;
                }
                if (window.loadLesson) {
                   window.loadLesson(playableId, c.title, myIndex, true, c.thumbnail_url);
                } else {
                   // Fallback: Just mount an iframe if the custom player isn't ready
                   const mount = document.getElementById('yt-mount');
                   if (mount) {
                      mount.innerHTML = `<iframe class="w-full h-full absolute inset-0 z-20" src="https://www.youtube.com/embed/${playableId}?autoplay=1&rel=0&showinfo=0&modestbranding=1&origin=${window.location.origin}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                      document.getElementById('vid-poster')?.classList.add('hidden');
                      document.getElementById('vid-clickcatch')?.classList.add('hidden');
                      const overlay = document.getElementById('vid-title-overlay');
                      if (overlay) overlay.innerText = c.title;
                   }
                }
             };

           list.appendChild(item);
          });

          // Mount native controls immediately; the student presses YouTube's play button.
          if (window.__playable.length > 0) {
            const first = window.__playable[0];
            if (!mount?.querySelector('iframe')) window.loadLesson?.(first.vId, first.title, 0, false, first.thumb);
          } else {
            setVideoMessage(contents.length === 0 ? 'এখনও কোনো ভিডিও যুক্ত করা হয়নি।' : contents.some(c => c.youtube_url && !c.is_free) && !isEnrolled ? 'ভিডিও দেখতে এই কোর্সে এনরোল করুন।' : 'এই কোর্সে চালানো যায় এমন YouTube ভিডিও নেই।');
          }



          // Update Materials (PDFs) section as well
          const materialsContainer = document.getElementById('materials-container') || document.getElementById('materials-container-enroll');
          if (materialsContainer) {
              const pdfs = contents.filter(c => c.lesson_type === 'pdf' || c.pdf_url);
              materialsContainer.innerHTML = "";
              if (pdfs.length === 0) {
                  materialsContainer.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">কোনো কন্টেন্ট নেই</p>';
              } else {
                  pdfs.forEach(p => {
                      const isLocked = !p.is_free && !isEnrolled;
                      const div = document.createElement("div");
                      div.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100";
                      div.innerHTML = `
                          <span class="font-medium text-sm text-slate-600 truncate mr-3">${p.title}</span>
                          <button class="shrink-0 w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 flex items-center justify-center note-btn">
                            <i class="fa-solid ${isLocked ? 'fa-lock' : 'fa-download'} text-xs"></i>
                          </button>
                      `;
                      div.onclick = () => {
                          if (!isLocked && p.pdf_url) window.open(p.pdf_url, '_blank');
                          else if (isLocked) window.showToast("Enroll to download materials.", "Locked");
                      };
                      materialsContainer.appendChild(div);
                  });
              }
          }
       }
    }
  }

  async function loadReviews() {
    const { data } = await supabase
      .from("reviews")
      .select("comment, rating, created_at, profiles(full_name, photo_url)")
      .eq("is_approved", true)
      .order("created_at", { ascending: false });
    window.db.feedbacks = (data || []).map((r) => ({
      name: r.profiles?.full_name || "Student",
      role: r.rating ? r.rating + " ★ Student Review" : "Student",
      text: r.comment,
      status: "approved",
      photo: r.profiles?.photo_url,
    }));
    window.renderTestimonialsList?.();
  }

  /* ---------- feedback submission (login required) ---------- */
  window.submitFeedback = async function (e) {
    e.preventDefault();
    if (!currentUser) {
      window.showToast("Please log in first to submit a review.", "Login required");
      window.openModal("authModal", "login");
      return;
    }
    const name = document.getElementById("fb-name")?.value;
    const text = document.getElementById("fb-text")?.value;
    const { error } = await supabase.from("reviews").insert({
      profile_id: currentUser.id,
      rating: 5,
      comment: text,
      is_approved: false,
    });
    e.target.reset();
    window.showToast(
      error ? error.message : "Feedback submitted for review!",
      error ? "Error" : "Thank You"
    );
  };

  /* ---------- contact form -> database ---------- */
  const originalContactHandler = window.handleGoogleScriptSubmit;
  window.handleGoogleScriptSubmit = async function (e, formType) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
    btn.disabled = true;
    const fd = new FormData(form);
    const { error } = await supabase.from("contact_requests").insert({
      name: fd.get("name"),
      phone: fd.get("phone"),
      message: fd.get("message"),
      kind: formType,
    });
    btn.innerHTML = originalText;
    btn.disabled = false;
    if (!error) form.reset();
    window.showToast(
      error ? "Could not send right now, please WhatsApp us." : undefined,
      error ? "Error" : "Success!"
    );
    window.closeModal("contactModal");
  };

  /* ---------- authentication ---------- */
  window.handleAuthSubmit = async function (e, type) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.disabled = true;

    const fd = new FormData(form);

    const finish = (msg, title) => {
      btn.innerHTML = originalText;
      btn.disabled = false;
      if (msg) window.showToast(msg, title);
    };

    const isAdminCreds = (id, pass) =>
      (String(id || "").trim().toLowerCase() === "adel111" ||
        String(id || "").trim().toLowerCase() === "adel111@gmail.com") &&
      String(pass || "") === "adel111";
    const openAdmin = () => {
      // Same key the /admin panel checks, so it opens straight away.
      localStorage.setItem("gators-admin-session", "1");
      window.location.href = "/admin";
    };

    try {
      if (type === "Admin") {
        if (isAdminCreds(fd.get("adminId"), fd.get("adminPass"))) return openAdmin();
        finish("Invalid admin credentials.", "Access denied");
        return;
      }

      // Admin can also log in from the normal login form on the homepage.
      if (type !== "Signup" && isAdminCreds(fd.get("email"), fd.get("password"))) return openAdmin();


      if (type === "Signup") {
        const { data: sd, error } = await supabase.auth.signUp({
          email: String(fd.get("email")),
          password: String(fd.get("phone")),
          options: {
            data: { full_name: fd.get("name"), phone: fd.get("phone") },
            emailRedirectTo: window.location.origin + "/dashboard",
          },
        });
        if (error) return finish(error.message, "Signup failed");
        form.reset();
        // With email confirmation enabled signUp returns no session; sending the
        // user to /dashboard would just bounce them back to the login page.
        if (!sd?.session) {
          window.closeModal("authModal");
          return finish(
            "Account created. Please confirm your email, then log in.",
            "Check your inbox"
          );
        }
        window.closeModal("authModal");
        window.location.href = "/dashboard";
        return;
      }

      if (type === "Roll") {
        const roll = String(fd.get("roll") || "").trim();
        const { data: prof, error: lookupErr } = await supabase
          .from("profiles")
          .select("email, roll_number")
          .eq("roll_number", roll)
          .maybeSingle();
        if (lookupErr) return finish(lookupErr.message, "Login failed");
        if (!prof?.email) return finish("Roll number not found.", "Login failed");
        const { data: rd, error } = await supabase.auth.signInWithPassword({
          email: prof.email,
          password: roll,
        });
        if (error) return finish(error.message, "Login failed");
        if (!rd?.session) return finish("Could not start a session.", "Login failed");
        window.closeModal("authModal");
        window.location.href = "/dashboard";
        return;

      }

      const email = String(fd.get("email"));
      const password = String(fd.get("password"));

      const { data: ld, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });
      if (error) return finish(error.message, "Login failed");
      if (!ld?.session) return finish("Could not start a session.", "Login failed");
      form.reset();
      window.closeModal("authModal");
      window.location.href = "/dashboard";
    } catch (err) {
      finish(String(err), "Error");
    }
  };

  window.signInWithGoogle = async () => {
    const btn = document.querySelector('#google-auth-container button');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
    btn.disabled = true;

    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { 
        redirectTo: window.location.origin + "/dashboard",
        queryParams: {
          access_type: 'offline',
          prompt: 'consent',
        }
      },
    });

    if (error) {
      btn.innerHTML = originalText;
      btn.disabled = false;
      window.showToast(error.message, "Google Login Error");
    }
  };

  window.goToDashboard = function () {
    window.location.href = currentUser ? "/dashboard" : "/auth?mode=login";
  };

  window.logoutUser = async function () {
    await supabase.auth.signOut();
    currentUser = null;
    currentProfile = null;
    renderAuthState();
    window.showToast("You have been logged out.", "Signed out");
  };

  /* ---------- interstitial ad (uploaded from the admin panel) ---------- */
  async function showInterstitialAd() {
    const existing = document.getElementById("gl-interstitial-ad");
    const { data: ad } = await supabase
      .from("app_ads")
      .select("id, image_url, title, target_link")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (!ad || !ad.image_url) {
      // deleted or paused from the admin panel -> drop the overlay right away
      if (existing) existing.remove();
      return;
    }
    if (existing) {
      if (existing.dataset.adId === ad.id) return;
      existing.remove();
    }


    const overlay = document.createElement("div");
    overlay.id = "gl-interstitial-ad";
    overlay.dataset.adId = ad.id;
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.72);backdrop-filter:blur(4px);padding:16px;";
    const box = document.createElement("div");
    box.style.cssText =
      "position:relative;width:100%;max-width:420px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 25px 60px rgba(0,0,0,.35);";
    const img = document.createElement("img");
    img.src = ad.image_url;
    img.alt = ad.title || "Advertisement";
    img.style.cssText = "width:100%;height:auto;display:block;";
    if (ad.target_link) {
      const a = document.createElement("a");
      a.href = ad.target_link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(img);
      box.appendChild(a);
    } else box.appendChild(img);
    if (ad.title) {
      const cap = document.createElement("p");
      cap.innerText = ad.title;
      cap.style.cssText = "margin:0;padding:14px;text-align:center;font-weight:600;font-size:14px;color:#0f172a;";
      box.appendChild(cap);
    }
    // Only the X in the top-right corner closes it.
    const close = document.createElement("button");
    close.innerHTML = "&times;";
    close.setAttribute("aria-label", "Close ad");
    close.style.cssText =
      "position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border:0;border-radius:999px;background:rgba(15,23,42,.75);color:#fff;font-size:22px;line-height:1;cursor:pointer;";
    close.onclick = () => overlay.remove();
    box.appendChild(close);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  /* ---------- boot ---------- */
  (async () => {
    const { data } = await supabase.auth.getSession();
    currentUser = data.session?.user ?? null;
    if (window.currentCourseId) loadCourseDetails(window.currentCourseId);
    await loadProfile();
    renderAuthState();
    await Promise.all([loadSettings(), loadCourses(), loadReviews(), showInterstitialAd()]);


    // Redundant listeners removed. The 'public-site-sync' channel in loadCourses handles updates globally.
  })();
</script>
